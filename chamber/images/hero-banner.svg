<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Manos de Quilla artisan hero banner</title>
  <desc id="heroDesc">Flat illustration of Barranquilla artisans' jewelry, weaving, and Carnival motifs in coral, turquoise, and gold tones.</desc>

  <!-- Background -->
  <rect width="1200" height="520" fill="#FAF1E4"/>
  <rect width="1200" height="520" fill="#E85C41" opacity="0.06"/>

  <!-- Sun / Carnival mask centerpiece -->
  <circle cx="600" cy="230" r="150" fill="#F2B134"/>
  <g fill="#FAF1E4" opacity="0.9">
    <circle cx="555" cy="205" r="14"/>
    <circle cx="645" cy="205" r="14"/>
    <path d="M545 265c15 20 35 30 55 30s40-10 55-30" fill="none" stroke="#FAF1E4" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g stroke="#F2B134" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="600" y1="40" x2="600" y2="80"/>
    <line x1="600" y1="380" x2="600" y2="420"/>
    <line x1="420" y1="230" x2="460" y2="230"/>
    <line x1="740" y1="230" x2="780" y2="230"/>
    <line x1="470" y1="100" x2="497" y2="127"/>
    <line x1="703" y1="333" x2="730" y2="360"/>
    <line x1="730" y1="100" x2="703" y2="127"/>
    <line x1="497" y1="333" x2="470" y2="360"/>
  </g>

  <!-- Left: jewelry motif -->
  <g transform="translate(120,120)">
    <circle cx="60" cy="40" r="34" fill="none" stroke="#159A9C" stroke-width="8"/>
    <circle cx="60" cy="120" r="22" fill="#159A9C"/>
    <line x1="60" y1="74" x2="60" y2="98" stroke="#159A9C" stroke-width="8"/>
    <circle cx="30" cy="200" r="14" fill="#E85C41"/>
    <circle cx="70" cy="220" r="10" fill="#F2B134"/>
    <circle cx="100" cy="190" r="8" fill="#159A9C"/>
  </g>

  <!-- Right: woven hat motif -->
  <g transform="translate(940,150)">
    <ellipse cx="70" cy="150" rx="120" ry="26" fill="#159A9C"/>
    <path d="M-10 150C-10 90 30 30 70 30s80 60 80 120" fill="none" stroke="#22201D" stroke-width="6" opacity="0.5"/>
    <path d="M10 150C10 100 40 55 70 55s60 45 60 95" fill="none" stroke="#22201D" stroke-width="5" opacity="0.35"/>
  </g>

  <!-- Bottom wave / coastline -->
  <path d="M0 470c150-30 300-30 450 0s300 30 450 0 300-30 300-30v80H0z" fill="#159A9C" opacity="0.85"/>
  <path d="M0 500c150-24 300-24 450 0s300 24 450 0 300-24 300-24v44H0z" fill="#0d6f70"/>

  <!-- Small bead accents -->
  <g fill="#E85C41">
    <circle cx="250" cy="440" r="8"/>
    <circle cx="950" cy="440" r="8"/>
    <circle cx="600" cy="455" r="6"/>
  </g>
</svg>
